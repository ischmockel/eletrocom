<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Cliente — iSchmockel Engenharia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
html,body{overflow-x:hidden;max-width:100%;margin:0;padding:0}
*,*::before,*::after{box-sizing:border-box}
:root{
  --verde:#0F372C;--verde2:#1a5244;
  --ouro:#DCB072;--ouro2:#C59748;
  --creme:#F7F3ED;--cinza:#6B7280;
  --borda:#E5E0D8;--branco:#FFFFFF;
}
body{font-family:"Poppins",sans-serif;background:var(--creme);color:var(--verde);min-height:100vh}

/* LOGIN */
#tela-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--verde)}
.login-box{background:var(--branco);border-radius:14px;padding:2.5rem 2.8rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-logo{display:flex;justify-content:center;margin-bottom:1.8rem}
.login-logo img{height:52px;width:auto;max-width:100%}
.login-titulo{text-align:center;font-size:0.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cinza);margin-bottom:0.4rem}
.login-subtitulo{text-align:center;font-family:"DM Serif Display",serif;font-size:1.25rem;color:var(--verde);margin-bottom:1.8rem;line-height:1.3}
.login-box label{display:block;font-size:0.7rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);margin-bottom:0.5rem}
.login-box input[type=password]{width:100%;padding:0.7rem 1rem;border:1.5px solid var(--borda);border-radius:8px;font-family:"Poppins",sans-serif;font-size:0.9rem;color:var(--verde);background:var(--creme);outline:none;transition:border-color 0.2s;margin-bottom:1rem}
.login-box input[type=password]:focus{border-color:var(--ouro)}
.btn-entrar{width:100%;background:var(--verde);color:var(--ouro);border:none;border-radius:8px;padding:0.8rem;font-family:"Poppins",sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:background 0.2s}
.btn-entrar:hover{background:var(--verde2)}
.login-erro{display:none;margin-top:0.8rem;text-align:center;font-size:0.75rem;color:#DC2626;font-weight:500}

/* PORTAL */
#portal{display:none}

/* HEADER */
header{background:var(--verde);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--ouro)}
.header-logo img{height:30px;width:auto;display:block}
.header-right{display:flex;align-items:center;gap:1rem}
.obra-badge{background:rgba(220,176,114,0.15);border:1px solid rgba(220,176,114,0.4);color:var(--ouro);font-size:0.7rem;font-weight:500;padding:4px 12px;border-radius:20px}
.avatar{width:34px;height:34px;background:var(--verde2);border:2px solid var(--ouro2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600;color:var(--ouro)}

/* HERO */
.obra-hero{background:var(--verde);padding:2.2rem 2rem 1.8rem}
.obra-info h1{font-family:"DM Serif Display",serif;font-size:1.75rem;color:var(--branco);font-weight:400;line-height:1.15;margin:0 0 0.3rem}
.obra-info p{font-size:0.78rem;color:rgba(255,255,255,0.5);font-weight:300;margin:0}

/* TABS */
.tabs{background:var(--verde2);display:flex;padding:0 2rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0.85rem 1.2rem;font-size:0.75rem;font-weight:500;color:rgba(255,255,255,0.45);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;letter-spacing:0.3px;white-space:nowrap;user-select:none}
.tab:hover{color:rgba(255,255,255,0.8)}
.tab.ativo{color:var(--ouro);border-bottom-color:var(--ouro)}

/* MAIN */
main{max-width:920px;margin:0 auto;padding:2rem}

/* SEÇÃO */
.secao{display:none}
.secao.ativa{display:block}
.secao-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:0.6rem;border-bottom:1px solid var(--borda)}
.secao-titulo{font-size:0.68rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ouro2)}

/* CARD DE PASTA — único por aba */
.pasta-card{
  background:var(--branco);
  border:1px solid var(--borda);
  border-radius:12px;
  padding:2rem 2rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:2rem;
  transition:box-shadow 0.2s, border-color 0.2s;
}
.pasta-card:hover{
  box-shadow:0 6px 24px rgba(15,55,44,0.1);
  border-color:var(--ouro2);
}

.pasta-info{display:flex;align-items:center;gap:1.2rem}

.pasta-icone{
  width:52px;height:52px;
  background:var(--verde);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.pasta-icone svg{width:26px;height:26px}

.pasta-texto{}
.pasta-nome{
  font-family:"DM Serif Display",serif;
  font-size:1.15rem;
  color:var(--verde);
  font-weight:400;
  margin-bottom:0.25rem;
}
.pasta-desc{font-size:0.76rem;color:var(--cinza);line-height:1.5}

.btn-acessar{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--verde);
  color:var(--ouro);
  border:none;
  border-radius:8px;
  padding:0.75rem 1.4rem;
  font-family:"Poppins",sans-serif;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.3px;
  cursor:pointer;
  text-decoration:none;
  transition:background 0.2s;
  white-space:nowrap;
  flex-shrink:0;
}
.btn-acessar:hover{background:var(--verde2)}
.btn-acessar svg{width:15px;height:15px}

.sem-link{
  text-align:center;
  padding:2.5rem 1rem;
  color:var(--cinza);
  font-size:0.8rem;
  background:var(--branco);
  border:1px dashed var(--borda);
  border-radius:12px;
  line-height:1.8;
}
.sem-link code{background:var(--borda);padding:2px 7px;border-radius:4px;font-size:0.75rem}

/* FOOTER */
footer{text-align:center;padding:1.5rem 2rem;font-size:0.65rem;color:var(--cinza);border-top:1px solid var(--borda);margin-top:2rem}
footer strong{color:var(--verde)}

@media(max-width:600px){
  .pasta-card{flex-direction:column;align-items:flex-start}
  .btn-acessar{width:100%;justify-content:center}
}
</style>
</head>

  diario:      "https://drive.google.com/drive/folders/1DSvobJwUZnnWRcdOWZaES4durABOYbfM",
  fechamentos: "https://drive.google.com/drive/folders/1MxlCwdwT7C49jgwWb07l4ssjFAWmcluI",
  projetos:    "https://drive.google.com/drive/folders/1r5En9aXuL7yLWG0d0Mqs--53_4UCSi3s",
  contratos:   "https://drive.google.com/drive/folders/1AXBA8frhOAebVeGZWERJVTxOBO81ViUI",
  outros:      "https://drive.google.com/drive/folders/10oz9f1FvGE0rM8G-N-uZowi7mZ1qGxUk"
};
// ================================================================
//  FIM DA CONFIGURAÇÃO
// ================================================================

var ICONE_PASTA = '<svg fill="none" stroke="var(--ouro)" stroke-width="1.6" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
var ICONE_SETA  = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

var ABAS = {
  relatorios:  { titulo: "Relatórios",  desc: "Dashboard de acompanhamento da obra" },
  diario:      { titulo: "Diário de Obra",           desc: "Registros fotográficos semanais" },
  fechamentos: { titulo: "Fechamentos",               desc: "Medições e fechamentos mensais e semanais da obra" },
  projetos:    { titulo: "Projetos",                  desc: "Projetos arquitetônicos, estruturais e complementares" },
  contratos:   { titulo: "Contratos e Documentos",    desc: "Contrato de prestação de serviços e proposta comercial" },
  outros:      { titulo: "Outros",                    desc: "Demais documentos disponibilizados pela iSchmockel" }
};

// Login
document.getElementById("login-nome-obra").textContent = CONF.nomeObra;
document.getElementById("campo-senha").addEventListener("keydown", function(e){
  if(e.key==="Enter") tentarLogin();
});

function tentarLogin(){
  if(document.getElementById("campo-senha").value === CONF.senha){
    document.getElementById("tela-login").style.display="none";
    document.getElementById("portal").style.display="block";
    iniciar();
  } else {
    document.getElementById("login-erro").style.display="block";
    document.getElementById("campo-senha").value="";
    document.getElementById("campo-senha").focus();
  }
}

function iniciar(){
  var ini = CONF.nomeCliente.split(" ").map(function(p){return p[0];}).slice(0,2).join("");
  document.getElementById("badge-obra").textContent = CONF.nomeObra;
  document.getElementById("avatar-cliente").textContent = ini;
  document.getElementById("hero-nome-obra").textContent = CONF.nomeObra;
  document.getElementById("hero-info-obra").textContent = CONF.infoObra;
  Object.keys(ABAS).forEach(renderCard);
}

function renderCard(aba){
  var el   = document.getElementById("card-"+aba);
  var info = ABAS[aba];
  var link = PASTAS[aba];

  if(!link){
    el.innerHTML = '<div class="sem-link">Pasta ainda não configurada.<br>Edite o bloco <code>PASTAS.'+aba+'</code> no código com o link do Drive.</div>';
    return;
  }

  el.innerHTML =
    '<a class="pasta-card" href="'+link+'" target="_blank">'
      +'<div class="pasta-info">'
        +'<div class="pasta-icone">'+ICONE_PASTA+'</div>'
        +'<div class="pasta-texto">'
          +'<div class="pasta-nome">'+info.titulo+'</div>'
          +'<div class="pasta-desc">'+info.desc+'</div>'
        +'</div>'
      +'</div>'
      +'<span class="btn-acessar">Acessar no Drive '+ICONE_SETA+'</span>'
    +'</a>';
}

function trocarTab(id,el){
  document.querySelectorAll(".secao").forEach(function(s){s.classList.remove("ativa");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("ativo");});
  document.getElementById(id).classList.add("ativa");
  el.classList.add("ativo");
}
</script>
